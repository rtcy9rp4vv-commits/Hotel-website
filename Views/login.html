<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login  -  Hotel Mundo de Perezosos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Assets/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container-fluid login-contenedor">
        <div class="row login-fila">
            <div class="col-md-5 login-panel">
                <div class="card">
                    <div class="card-body">
                        <h1 class="nombre-hotel">
                            Hotel Mundo de Perezosos
                        </h1>

                        <h2 class="text-center mb-4">
                            Inicio de Sesión
                        </h2>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fa-solid fa-user"></i> Usuario
                                </label>
                                <input type="text" id="usuario" class="form-control" placeholder="Ingrese su usuario">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fa-solid fa-lock"></i> Contraseña
                                </label>
                                <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña">
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                Iniciar sesión 
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="Assets/js/login.js"></script>
</body>
</html>
