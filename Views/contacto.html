<style>
  @import url("https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=IM+Fell+Great+Primer&family=Lobster&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
</style>
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="stylesheet" href="../css/contacto.css" /> 
  </head>
hola mundo
  <body>
    <section class="contact-section">
      <div class="contact-container">
        <!-- Header -->
        <div class="contact-header">
          <p class="eyebrow">Contacto</p>
          <h2>Hablemos</h2>
          <p class="subtitle">
            ¿Tienes una pregunta? Nos encantaría escucharte.
          </p>
        </div>

        <!-- Main Content -->
        <div class="contact-content">
          <!-- Formulario -->
          <div class="form-container">
            <form class="contact-form">
              <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required />
              </div>

              <div class="form-group">
                <label for="email">Gmail</label>
                <input type="email" id="email" name="email" required />
              </div>

              <div class="form-group">
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" required />
              </div>

              <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" required>
                </textarea>
              </div>

              <button type="submit" class="btn-submit">Enviar</button>
            </form>
          </div>

          <!-- Info y Mapa -->
          <div class="info-container">
            <div class="contact-info">
              <h3>Información de contacto</h3>
              <div class="info-items">
                <a href="gmail: hotelejemplar@gmail.com" class="info-link">
                  <span class="icon">✉️</span>
                  <span>hotelejemplar@gmail.com </span>
                </a>
                <a href="tel: 7290-4868" class="info-link">
                  <span class="icon">📱</span>
                  <span>(+506) 7290-4868</span>
                </a>
                <div class="info-link">
                  <span class="icon">🗺️</span>
                  <span>Alajuela, San Carlos, Costa Rica</span>
                </div>
              </div>

              <!-- Redes Sociales -->
              <div class="social-links">
                <a
                  href="https://instagram.com/tuusuario"
                  target="_blank"
                  rel="noreferrer"
                  >Instagram</a
                >
                <a
                  href="https://twitter.com/tuusuario"
                  target="_blank"
                  rel="noreferrer"
                  >Twitter</a
                >
              </div>
            </div>

            <!-- Google Maps -->
            <div class="map-container">
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d993759.1119501984!2d-84.53163665256766!3d10.482346901871837!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8fa077e881828f4f%3A0xea6f02d26460f2fc!2sProvincia%20de%20Alajuela%2C%20San%20Carlos!5e1!3m2!1ses!2scr!4v1790712192045!5m2!1ses!2scr"
                width="600"
                height="450"
                style="border: 0"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
              >
              </iframe>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
